name: Generate Snake
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # ✅ Auto-create output folder BEFORE running
      - name: Create Output Folder
        run: mkdir -p output
      
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shermanjk
          output_svg: output/github-contribution-grid-snake.svg
          
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
